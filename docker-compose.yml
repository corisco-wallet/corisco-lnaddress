name: corisco-lnaddress

services:
  lnaddress:
    build: .
    image: corisco-lnaddress:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      SPARK_NETWORK: ${SPARK_NETWORK:-REGTEST}
      LNADDRESS_DOMAIN: ${LNADDRESS_DOMAIN:?LNADDRESS_DOMAIN is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      SERVER_MNEMONIC: ${SERVER_MNEMONIC:?SERVER_MNEMONIC is required}
      MAX_SENDABLE_SATS: ${MAX_SENDABLE_SATS:-1000000}
    volumes:
      - lnaddress-data:/data

volumes:
  lnaddress-data:
