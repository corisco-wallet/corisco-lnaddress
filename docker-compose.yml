name: corisco-lnaddress

services:
  lnaddress:
    build: .
    image: corisco-lnaddress:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      SPARK_NETWORK: ${SPARK_NETWORK:-REGTEST}
      LNADDRESS_DOMAIN: ${LNADDRESS_DOMAIN:?LNADDRESS_DOMAIN is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      SERVER_MNEMONIC: ${SERVER_MNEMONIC:?SERVER_MNEMONIC is required}
      MAX_SENDABLE_SATS: ${MAX_SENDABLE_SATS:-1000000}
    volumes:
      - lnaddress-data:/data

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - lnaddress
    ports:
      - "443:443"
      - "443:443/udp"
    environment:
      LNADDRESS_DOMAIN: ${LNADDRESS_DOMAIN:?LNADDRESS_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  lnaddress-data:
  caddy-data:
  caddy-config:
