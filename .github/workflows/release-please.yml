name: release-please

on:
  push:
    branches: [main]
  # Deploy any branch to test, or redeploy a release tag to production. Run it from main.
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        options: [test, production]
        default: test
      ref:
        description: "Branch, tag or SHA to deploy (production: a release tag like v0.2.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Opens/updates the release PR (version bump in package.json, CHANGELOG.md)
  # from conventional commits; merging it tags vX.Y.Z and creates the GitHub Release.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Every push to main goes to test.
  deploy-test:
    if: github.event_name == 'push' || inputs.environment == 'test'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: test
      ref: ${{ inputs.ref || github.sha }}

  # Only new releases, or a manual redeploy of a release tag, go to production.
  deploy-production:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production'))
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ needs.release-please.outputs.tag_name || inputs.ref }}
